name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # 127.0.0.1, not localhost: on the Ubuntu runner, "localhost" can
  # resolve to ::1 (IPv6), but the postgres service container's port is
  # only published on 0.0.0.0 (IPv4) — an IPv6-resolved connection gets
  # ECONNREFUSED with nothing listening on ::1, while an IPv4 one
  # succeeds. Since each test file opens its own connection independently
  # (no shared pool across vitest's per-file isolation), this surfaced as
  # scattered, intermittent test failures rather than a clean pass/fail.
  DATABASE_URL: "postgresql://transitpulse:transitpulse@127.0.0.1:5432/transitpulse"
  # Required by src/lib/env.ts with no default — missing here never broke
  # lint-test-build (its own `pnpm build` step never ran; every prior CI
  # run failed earlier, at typecheck or the test-DB connection issue
  # above), but broke the e2e job's Playwright webServer, which does run
  # a real `next build`.
  NEXT_PUBLIC_APP_NAME: "TransitPulse"
  # No Redis service in CI: nothing in typecheck/lint/test/build actually
  # opens a connection (Phase 10's worker and SSE route are verified
  # manually — see DECISIONS.md ADR-021), env.ts only validates the URL
  # shape at import time.
  REDIS_URL: "redis://localhost:6379"
  BETTER_AUTH_SECRET: "ci-secret-not-for-production-use-0123456789"
  BETTER_AUTH_URL: "http://localhost:3000"

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: transitpulse
          POSTGRES_PASSWORD: transitpulse
          POSTGRES_DB: transitpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U transitpulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # prisma generate's custom output path (prisma/schema.prisma ->
      # src/generated/prisma) is gitignored, and next typegen's route/layout
      # types (.next/types) are gitignored too — both are produced locally
      # by running dev/build/generate at least once, but a fresh CI
      # checkout has neither, so both must be generated explicitly before
      # anything (typecheck, seed) imports them.
      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Generate Next.js route types
        run: pnpm exec next typegen

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (Biome)
        run: pnpm lint

      - name: Apply migrations
        run: pnpm exec prisma migrate deploy

      - name: Seed demo data
        run: pnpm db:seed

      - name: Unit + component tests
        env:
          DATABASE_URL: "postgresql://transitpulse:transitpulse@127.0.0.1:5432/transitpulse_test"
        run: |
          PGPASSWORD=transitpulse psql -h 127.0.0.1 -U transitpulse -d transitpulse -c "CREATE DATABASE transitpulse_test;"
          pnpm exec prisma migrate deploy
          pnpm test

      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    # Non-blocking for now — see TESTING.md for the plan to make this
    # required once it has proven stable in CI.
    continue-on-error: true
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: transitpulse
          POSTGRES_PASSWORD: transitpulse
          POSTGRES_DB: transitpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U transitpulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Apply migrations and seed
        run: |
          pnpm exec prisma migrate deploy
          pnpm db:seed

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright
        run: pnpm test:e2e
